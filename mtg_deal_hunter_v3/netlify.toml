[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."scan-deals"]
  schedule = "@hourly"

[functions."price-watch"]
  schedule = "@hourly"

[functions."top20-run"]
  schedule = "@hourly"

[functions."breakout-run"]
  schedule = "@hourly"

[functions."tracked-price-run"]
  schedule = "@hourly"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/tracker-ui.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/tracker-bootstrap.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
